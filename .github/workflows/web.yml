# Compila la app web (Kotlin/Wasm) y la publica en GitHub Pages.
# - En cada Pull Request solo compila, para avisar si el cambio rompe la app.
# - Al hacer merge en develop o main, compila y publica.
name: Publicar app web

on:
  push:
    branches: [develop, main]
    paths:
      - "megafarma-app/**"
      - ".github/workflows/web.yml"
  pull_request:
    branches: [develop, main]
    paths:
      - "megafarma-app/**"
      - ".github/workflows/web.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compilar:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: megafarma-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Compilar la version web
        run: |
          chmod +x gradlew
          ./gradlew :shared:wasmJsBrowserDistribution --no-daemon
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: megafarma-app/shared/build/dist/wasmJs/productionExecutable

  publicar:
    if: github.event_name != 'pull_request'
    needs: compilar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - id: despliegue
        uses: actions/deploy-pages@v4
