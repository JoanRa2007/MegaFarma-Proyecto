# Perfil de desarrollo: PostgreSQL levantado con "docker compose up -d".
spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/megafarma
    username: megafarma
    password: megafarma

logging:
  level:
    root: INFO
    pe.edu.upeu.megafarma: DEBUG

# Swagger disponible solo en desarrollo (documentacion y pruebas de la API).
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

app:
  swagger:
    habilitado: true
