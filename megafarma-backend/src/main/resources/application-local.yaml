# Perfil local: base H2 en archivo (./data), no requiere instalar nada.
# Ejecutar con:  mvnw spring-boot:run -Dspring-boot.run.profiles=local
spring:
  datasource:
    url: jdbc:h2:file:./data/megafarma;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
  h2:
    console:
      enabled: false

logging:
  level:
    root: INFO
    pe.edu.upeu.megafarma: DEBUG
