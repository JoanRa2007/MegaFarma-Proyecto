services:
  db:
    image: postgres:17-alpine
    container_name: megafarma-db
    environment:
      POSTGRES_DB: megafarma
      POSTGRES_USER: megafarma
      POSTGRES_PASSWORD: megafarma
    ports:
      - "5433:5432"
    volumes:
      - megafarma_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U megafarma -d megafarma"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  megafarma_pgdata:
